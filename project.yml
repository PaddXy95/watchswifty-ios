name: WatchSwifty
options:
  bundleIdPrefix: dev.patmei
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  WatchSwiftyCore:
    path: Packages/WatchSwiftyCore
targets:
  WatchSwifty:
    type: application
    platform: iOS
    sources:
      - WatchSwifty
    dependencies:
      - package: WatchSwiftyCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.patmei.watchswifty
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: WatchSwifty/Info.plist
      properties:
        CFBundleDisplayName: WatchSwifty
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: dev.patmei.watchswifty
            CFBundleURLSchemes:
              - dev.patmei.watchswifty
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: WatchSwifty verbindet sich mit deinem Server im Heimnetz.
        ITSAppUsesNonExemptEncryption: false
